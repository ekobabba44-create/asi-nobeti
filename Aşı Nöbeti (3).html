var done={},xp=0,s=null,A=document.getElementById("app");
var NP=9;
var DB="https://asifarkindaligi-9b11e-default-rtdb.firebaseio.com";
var nick="",best={};
try{nick=localStorage.getItem("nick")||"";best=JSON.parse(localStorage.getItem("best")||"{}")}catch(e){}
function setNick(v){nick=v.replace(/[^A-Za-z0-9ÇĞİÖŞÜçğıöşü _-]/g,"").slice(0,16);try{localStorage.setItem("nick",nick)}catch(e){}}
function saveBest(){try{localStorage.setItem("best",JSON.stringify(best))}catch(e){}}
function total(){var t=0;for(var k in best)t+=best[k];return t}
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";"})}
function dbu(){return DB+"/scores/"+encodeURIComponent(nick.trim().replace(/ /g,"_"))+".json"}
function push(){if(!DB||!nick.trim())return;var u=dbu(),n=nick.trim(),sc=total();fetch(u).then(function(r){return r.json()}).then(function(o){if(!o||o.score<sc||!o.prog)return fetch(u,{method:"PUT",body:JSON.stringify({name:n,score:sc,t:Date.now(),prog:best})}).then(function(r){if(!r.ok)return fetch(u,{method:"PUT",body:JSON.stringify({name:n,score:sc,t:Date.now()})})})}).catch(function(){})}
